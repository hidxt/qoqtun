name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    name: build & test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # 1.26 resolves GO-2026-5972 (encoding/asn1) in the standard
          # library; the module itself declares go 1.22 as the minimum.
          go-version: "1.26"

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./...

      # -race needs a C toolchain (cgo); run it on ubuntu/macos where one is
      # always present (Windows runners may lack gcc).
      - name: Race
        if: matrix.os != 'windows-latest'
        run: go test -race ./...
